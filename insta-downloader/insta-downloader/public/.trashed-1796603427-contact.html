<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Us – Insta Downloader</title>
<meta name="description" content="Contact Insta Downloader.">
<link rel="canonical" href="%SITE_URL%/contact">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/theme-init.js"></script>
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="logo" href="/" aria-label="Insta Downloader">
      <span class="logo-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg></span>
      Insta Downloader
    </a>
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">☰</button>
    <nav class="nav-links" id="navLinks">
      <a href="/#home" data-i18n="nav_home">Home</a>
      <a href="/#how" data-i18n="nav_how">How to</a>
      <a href="/#history" data-i18n="nav_history">History</a>
      <a href="/#faq" data-i18n="nav_faq">FAQ</a>
      <a href="/contact" data-i18n="nav_contact">Contact</a>
      <span class="nav-tools">
        <button class="icon-btn" id="langBtn" aria-label="Language">हिंदी</button>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">🌙</button>
      </span>
    </nav>
  </div>
</header>
<main class="container page">
<h1><span class="l-en">Contact Us</span><span class="l-hi">हमसे संपर्क करें</span></h1>
<p><span class="l-en">Have a question, feedback or a copyright request? Send us a message.</span><span class="l-hi">कोई सवाल, सुझाव या कॉपीराइट अनुरोध है? हमें संदेश भेजें।</span></p>
<form id="cForm" novalidate>
  <div class="field"><label for="cName"><span class="l-en">Name</span><span class="l-hi">नाम</span></label><input id="cName" name="name" maxlength="80" autocomplete="name" required></div>
  <div class="field"><label for="cEmail"><span class="l-en">Email</span><span class="l-hi">ईमेल</span></label><input id="cEmail" name="email" type="email" maxlength="120" autocomplete="email" required></div>
  <div class="field"><label for="cMsg"><span class="l-en">Message</span><span class="l-hi">संदेश</span></label><textarea id="cMsg" name="message" rows="6" maxlength="2000" required></textarea></div>
  <input class="hp" id="cHp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button class="btn" type="submit"><span class="l-en">Send Message</span><span class="l-hi">संदेश भेजें</span></button>
  <div id="cMsgBox" class="msg" hidden role="status" aria-live="polite"></div>
</form>
</main>
<footer>
  <div class="container f-row">
    <div>© <span id="yr"></span> Insta Downloader</div>
    <div class="f-links">
      <a href="/privacy" data-i18n="privacy">Privacy Policy</a>
      <a href="/terms" data-i18n="terms">Terms &amp; Conditions</a>
      <a href="/contact" data-i18n="nav_contact">Contact</a>
    </div>
  </div>
</footer>
<div id="toast" class="toast" hidden></div>
<script src="/assets/contact.js" defer></script>
<script src="/assets/app.js" defer></script>
</body>
</html>
